name: 📝 Blog Manifest Sync

on:
  schedule:
    - cron: '0 19 * * *'  # 00:30 AM IST = 19:00 UTC previous day
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-posts:
    name: 🔄 Sync posts.json
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'

      - name: Run blog-manager.py
        run: python blog-manager.py

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet blog/posts.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      - name: Already in sync
        if: steps.diff.outputs.changed == 'false'
        run: echo "✅ posts.json is already in sync — no changes detected."

      - name: Create PR if changed
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "ci: sync posts.json"
          branch: ci/sync-posts-json
          title: "📝 [BLOG] posts.json out of sync — new post(s) detected"
          body: |
            ## Blog Manifest Sync

            `blog-manager.py` detected new or updated posts not reflected in `posts.json`.

            **Review the changes below and merge to update the blog listing.**

            > Auto-generated by blog manifest sync workflow.
          assignees: 3rr0r-505
          labels: blog manifest sync
          base: main